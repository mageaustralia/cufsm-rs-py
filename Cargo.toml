[package]
name = "cufsm-py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for cufsm-rs, a Rust port of CUFSM (finite strip buckling of thin-walled sections)."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
cufsm-rs = { path = "../cufsm-rs" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[profile.release]
lto = "thin"
codegen-units = 1
